server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets (including the seeded product images under /uploads)
    # are served directly; any other path falls back to index.html so
    # React Router can handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
