server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/xml text/xml image/svg+xml;

    # Long-lived caching for hashed build assets and the seeded product
    # images under /uploads - they either have a content hash in the
    # filename or rarely change, so browsers can cache them aggressively.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Static assets (including the seeded product images under /uploads)
    # are served directly; any other path falls back to index.html so
    # React Router can handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
