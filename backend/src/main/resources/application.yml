spring:
  application:
    name: ar-store-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arstore}
    username: ${DB_USERNAME:arstore}
    password: ${DB_PASSWORD:arstore}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:changeme@example.com}
    password: ${SMTP_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}

spring.servlet.multipart:
  max-file-size: 8MB
  max-request-size: 8MB

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-local-dev-only-secret-key-please-override-in-prod-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: ${JWT_ISSUER:ar-store}
  mail:
    from: ${MAIL_FROM:no-reply@arstore.local}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:test-secret-key}
    verify-url: ${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
    enabled: ${RECAPTCHA_ENABLED:true}
  seed:
    products-xml-path: ${SEED_PRODUCTS_XML_PATH:classpath:seed/products.xml}
  upload:
    dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    com.arstore: INFO
