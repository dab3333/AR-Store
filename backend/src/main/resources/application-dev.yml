# Local development overrides. Activate with -Dspring-boot.run.profiles=dev
# All real secrets still come from environment variables (see .env.example);
# the values below are non-secret local defaults only.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arstore}
    username: ${DB_USERNAME:arstore}
    password: ${DB_PASSWORD:arstore}
  jpa:
    show-sql: true

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # In local dev you generally don't have a live reCAPTCHA secret; set
  # RECAPTCHA_ENABLED=false in your shell/.env to skip verification while
  # developing the registration flow. Leave it true (default) in any
  # shared/staging/prod environment.
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:true}

logging:
  level:
    com.arstore: DEBUG
